<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LCTK Quiz — Pilih Tipe Soal</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="wrap">
  <nav class="card pad topnav">
    <div class="nav-left">
      <strong>LCTK Quiz</strong>
      <span class="muted" id="who">…</span>
    </div>
    <div class="nav-right">
      <a class="btn ghost" href="profile.html">Profil</a>
      <button type="button" class="btn ghost" id="logout-btn">Logout</button>
    </div>
  </nav>

  <header class="card pad">
    <h1>Pilih tipe soal</h1>
    <p class="sub">Setiap attempt: soal diacak + pilihan ABCD diacak. Progress per soal tersimpan di JSON (localStorage).</p>
    <div class="toolbar">
      <button type="button" class="btn ghost" id="export-btn">Export data JSON</button>
      <label class="btn ghost" style="margin:0;cursor:pointer">Import JSON
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </label>
    </div>
  </header>

  <section class="card pad">
    <div class="cat-grid" id="cat-grid"><div class="loading">Memuat kategori…</div></div>
  </section>
</div>
<script src="assets/js/core.js"></script>
<script>
(async () => {
  const ctx = await LCTK.AppContext.create();
  const user = ctx.auth.currentUser();
  if (!user) { location.href = 'login.html'; return; }
  document.getElementById('who').textContent = '@' + user.username;

  const grid = document.getElementById('cat-grid');
  const counts = Object.fromEntries(
    ctx.bank.categories.map((c) => [c.id, ctx.bank.byCategory(c.id).length])
  );

  const cards = [
    ...ctx.bank.categories.map((c) => ({
      id: c.id,
      title: c.title,
      desc: c.desc,
      count: counts[c.id] || 0,
    })),
    {
      id: 'all',
      title: 'Semua kategori',
      desc: 'Campur semua tipe soal dalam satu attempt',
      count: ctx.bank.questions.length,
    },
  ];

  grid.innerHTML = cards.map((c) => `
    <button type="button" class="cat-card" data-cat="${c.id}">
      <strong>${c.title}</strong>
      <span>${c.desc}</span>
      <em>${c.count} soal →</em>
    </button>`).join('');

  grid.querySelectorAll('.cat-card').forEach((btn) => {
    btn.addEventListener('click', () => {
      location.href = 'quiz.html?cat=' + encodeURIComponent(btn.dataset.cat);
    });
  });

  document.getElementById('logout-btn').addEventListener('click', () => {
    ctx.auth.logout();
    location.href = 'login.html';
  });

  document.getElementById('export-btn').addEventListener('click', () => {
    const blob = new Blob([ctx.store.exportJson()], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'lctk-quiz-data.json';
    a.click();
  });

  document.getElementById('import-file').addEventListener('change', async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      const text = await file.text();
      ctx.store.importJson(text);
      alert('Import berhasil. Reload…');
      location.reload();
    } catch (ex) {
      alert(ex.message || 'Import gagal');
    }
  });
})();
</script>
</body>
</html>
